name: Bug report
description: Something did not install, upgrade, check or uninstall correctly
labels: [bug]
body:
  - type: textarea
    id: status
    attributes:
      label: Output of `ctxup status`
      render: text
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: sudo ./ctxup install --version 2608
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What it printed
      description: Paste the full output. For install failures, add the last 50 lines of /var/log/ctxup.log.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
  - type: input
    id: version
    attributes:
      label: ctxup version
      description: Output of `ctxup -V`
    validations:
      required: true
