version: 2
updates:
  # Keeps the pinned actions in .github/workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    # Wait a week before proposing a new release, so a compromised one has
    # time to be noticed and pulled.
    cooldown:
      default-days: 7
